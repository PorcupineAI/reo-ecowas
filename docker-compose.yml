version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: reo-postgres
    environment:
      POSTGRES_USER: reo_user
      POSTGRES_PASSWORD: reo_password
      POSTGRES_DB: reo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/seed:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reo_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    container_name: reo-backend
    environment:
      DATABASE_URL: postgresql://reo_user:reo_password@postgres:5432/reo
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    container_name: reo-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8000
    volumes:
      - ./frontend:/app/frontend
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501

volumes:
  postgres_data:
